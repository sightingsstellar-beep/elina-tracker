<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2f7f9f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <title>Glide Bedside — Trends</title>
  <link rel="stylesheet" href="/vendor/phosphor/regular/style.css" />
  <link rel="stylesheet" href="/vendor/phosphor/fill/style.css" />
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="history.css" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div class="header-left">
        <h1 class="title"><span id="child-name">…</span> <span class="heart" aria-hidden="true"><i class="ph-fill ph-heart"></i></span></h1>
        <div class="subtitle" id="current-date">Loading...</div>
      </div>
      <div class="header-right">
        <div class="top-menu" data-top-menu>
          <button class="top-menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" data-top-menu-toggle>
            <span class="top-menu-toggle-line"></span>
            <span class="top-menu-toggle-line"></span>
            <span class="top-menu-toggle-line"></span>
          </button>
          <div class="top-nav" data-top-menu-panel>
            <a href="/" class="top-nav-item active" aria-current="page"><i class="ph ph-chart-line-up" aria-hidden="true"></i> <span>Chart</span></a>
            <a href="/patient-profile" class="top-nav-item"><i class="ph ph-heart" aria-hidden="true"></i> <span>Patient Profile</span></a>
            <a href="/settings" class="top-nav-item"><i class="ph ph-gear-six" aria-hidden="true"></i> <span>App Settings</span></a>
            <a href="/account" class="top-nav-item"><i class="ph ph-user-circle" aria-hidden="true"></i> <span>Account</span></a>
            <div class="account-menu">
              <button class="top-nav-trigger" type="button" aria-expanded="false" data-account-menu-button><i class="ph ph-user-circle" aria-hidden="true"></i> <span data-caregiver-name>Caregiver</span> <i class="ph ph-caret-down" aria-hidden="true"></i></button>
              <div class="account-menu-panel" hidden data-account-menu-panel>
                <a href="/account"><i class="ph ph-user-circle" aria-hidden="true"></i> Account</a>
                <a href="/caregivers"><i class="ph ph-users" aria-hidden="true"></i> Caregivers</a>
                <a href="/logout"><i class="ph ph-power" aria-hidden="true"></i> Log out</a>
              </div>
            </div>
          </div>
        </div>
        <div class="clock" id="current-time">--:--</div>
      </div>
    </div>
    <nav class="tab-bar" aria-label="Primary">
      <a href="/" class="tab-item">
        <span class="tab-icon" aria-hidden="true">
          <i class="tab-icon-outline ph ph-drop"></i>
          <i class="tab-icon-fill ph-fill ph-drop"></i>
        </span>
        <span class="tab-label">Daily Chart</span>
      </a>
      <a href="/chat" class="tab-item">
        <span class="tab-icon" aria-hidden="true">
          <i class="tab-icon-outline ph ph-microphone"></i>
          <i class="tab-icon-fill ph-fill ph-microphone"></i>
        </span>
        <span class="tab-label">Log by Voice</span>
      </a>
      <a href="/history" class="tab-item active" aria-current="page">
        <span class="tab-icon" aria-hidden="true">
          <i class="tab-icon-outline ph ph-chart-line-up"></i>
          <i class="tab-icon-fill ph-fill ph-chart-line-up"></i>
        </span>
        <span class="tab-label">Trends</span>
      </a>
    </nav>
  </header>

  <main class="main history-main">
    <section class="trends-toolbar card">
      <div class="trends-toolbar-top">
        <div>
          <h2 class="trends-heading"><span class="heading-icon" aria-hidden="true"><i class="ph ph-chart-line-up"></i></span> Trends</h2>
          <p class="trends-subheading">Tap any bar or point to jump into that day.</p>
        </div>
      </div>
      <div class="range-pills" id="range-pills">
        <button class="range-pill active" data-range="7">7D</button>
        <button class="range-pill" data-range="30">30D</button>
        <button class="range-pill" data-range="90">90D</button>
      </div>
    </section>

    <div id="trends-container">
      <div class="h-loading">Loading trends…</div>
    </div>
  </main>

  <footer class="footer">
    <span>Last updated: <span id="last-updated">--</span></span>
  </footer>

  <script src="auth-fetch.js"></script>
  <script src="viewport-guard.js"></script>
  <script src="version-watch.js"></script>
  <script src="nav.js"></script>
  <script src="history.js"></script>
</body>
</html>
