<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#2f7f9f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <title>Glide Bedside — Patient Profile</title>
  <link rel="stylesheet" href="/vendor/phosphor/regular/style.css" />
  <link rel="stylesheet" href="/vendor/phosphor/fill/style.css" />
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="settings.css" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div class="header-left">
        <h1 class="title"><span id="child-name">…</span> <span class="heart" aria-hidden="true"><i class="ph-fill ph-heart"></i></span></h1>
        <div class="subtitle" id="current-date">Loading...</div>
      </div>
      <div class="header-right">
        <div class="top-menu" data-top-menu>
          <button class="top-menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" data-top-menu-toggle>
            <span class="top-menu-toggle-line"></span>
            <span class="top-menu-toggle-line"></span>
            <span class="top-menu-toggle-line"></span>
          </button>
          <div class="top-nav" data-top-menu-panel>
            <div class="top-nav-group">
              <button class="top-nav-trigger" type="button">Chart <i class="ph ph-caret-down" aria-hidden="true"></i></button>
              <div class="top-nav-dropdown">
                <a href="/">Day</a>
                <a href="/history">Trends</a>
                <a href="/chat">Chat</a>
              </div>
            </div>
            <a href="/caregiver-profile" class="top-nav-item">Caregiver Profile</a>
            <a href="/patient-profile" class="top-nav-item active" aria-current="page">Patient Profile</a>
            <a href="/caregivers" class="top-nav-item">Caregivers</a>
            <a href="/settings" class="top-nav-item">App Settings</a>
            <div class="account-menu">
              <button class="top-nav-trigger" type="button" aria-expanded="false" data-account-menu-button><span data-caregiver-name>Caregiver</span> <i class="ph ph-caret-down" aria-hidden="true"></i></button>
              <div class="account-menu-panel" hidden data-account-menu-panel>
                <a href="/logout"><i class="ph ph-power" aria-hidden="true"></i> Log out</a>
              </div>
            </div>
          </div>
        </div>
        <div class="clock" id="current-time">--:--</div>
      </div>
    </div>
    <nav class="tab-bar" aria-label="Chart">
      <a href="/" class="tab-item">
        <span class="tab-icon" aria-hidden="true"><i class="tab-icon-outline ph ph-drop"></i><i class="tab-icon-fill ph-fill ph-drop"></i></span>
        <span class="tab-label">Day</span>
      </a>
      <a href="/history" class="tab-item">
        <span class="tab-icon" aria-hidden="true"><i class="tab-icon-outline ph ph-chart-line-up"></i><i class="tab-icon-fill ph-fill ph-chart-line-up"></i></span>
        <span class="tab-label">Trends</span>
      </a>
      <a href="/chat" class="tab-item">
        <span class="tab-icon" aria-hidden="true"><i class="tab-icon-outline ph ph-microphone"></i><i class="tab-icon-fill ph-fill ph-microphone"></i></span>
        <span class="tab-label">Chat</span>
      </a>
    </nav>
  </header>

  <main class="main settings-main">
    <h2 class="settings-heading"><span class="heading-icon" aria-hidden="true"><i class="ph ph-heart"></i></span> Patient Profile</h2>

    <section class="card settings-card">
      <div class="settings-section-title"><span class="section-title-icon" aria-hidden="true"><i class="ph ph-identification-card"></i></span> Basic Info</div>
      <div class="settings-field">
        <label for="child_name">Name</label>
        <input type="text" id="child_name" name="child_name" maxlength="50" placeholder="Patient name" />
      </div>
      <div class="settings-field">
        <label for="child_pronouns">Pronouns</label>
        <input type="text" id="child_pronouns" name="child_pronouns" maxlength="40" placeholder="she/her" />
      </div>
      <div class="settings-field">
        <label for="patient_birthdate">Birthdate</label>
        <input type="date" id="patient_birthdate" name="patient_birthdate" />
      </div>
      <div class="settings-field">
        <label for="patient_care_notes">Care notes</label>
        <textarea id="patient_care_notes" name="patient_care_notes" rows="4" maxlength="1000" placeholder="Useful care context"></textarea>
      </div>
    </section>

    <div class="settings-save-row">
      <button class="settings-save-btn" id="save-btn"><i class="ph ph-floppy-disk" aria-hidden="true"></i> Save Profile</button>
      <div class="settings-status" id="settings-status" aria-live="polite"></div>
    </div>
  </main>

  <footer class="footer"><span>Glide Bedside</span></footer>

  <script src="auth-fetch.js"></script>
  <script src="version-watch.js"></script>
  <script src="nav.js"></script>
  <script src="settings.js"></script>
</body>
</html>
