<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#2f7f9f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <title>Glide Bedside — Profile</title>
  <link rel="stylesheet" href="/vendor/phosphor/regular/style.css" />
  <link rel="stylesheet" href="/vendor/phosphor/fill/style.css" />
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="settings.css" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
</head>
<body class="no-chart-tabs">
  <header class="header">
    <div class="header-top">
      <div class="header-left">
        <h1 class="title"><span id="child-name">…</span> <span class="heart" aria-hidden="true"><i class="ph-fill ph-heart"></i></span></h1>
        <div class="subtitle" id="current-date">Loading...</div>
      </div>
      <div class="header-right">
        <div class="top-menu" data-top-menu>
          <button class="top-menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" data-top-menu-toggle>
            <span class="top-menu-toggle-line"></span>
            <span class="top-menu-toggle-line"></span>
            <span class="top-menu-toggle-line"></span>
          </button>
          <div class="top-nav" data-top-menu-panel>
            <a href="/" class="top-nav-item"><i class="ph ph-chart-line-up" aria-hidden="true"></i> <span>Chart</span></a>
            <a href="/caregivers" class="top-nav-item"><i class="ph ph-users" aria-hidden="true"></i> <span>Caregivers</span></a>
            <a href="/settings" class="top-nav-item"><i class="ph ph-gear-six" aria-hidden="true"></i> <span>App Settings</span></a>
            <div class="account-menu">
              <button class="top-nav-trigger active" type="button" aria-expanded="false" data-account-menu-button><i class="ph ph-user-circle" aria-hidden="true"></i> <span data-caregiver-name>Caregiver</span> <i class="ph ph-caret-down" aria-hidden="true"></i></button>
              <div class="account-menu-panel" hidden data-account-menu-panel>
                <a href="/caregiver-profile" class="active" aria-current="page"><i class="ph ph-user-circle" aria-hidden="true"></i> Profile</a>
                <a href="/patient-profile"><i class="ph ph-heart" aria-hidden="true"></i> Patient Profile</a>
                <a href="/logout"><i class="ph ph-power" aria-hidden="true"></i> Log out</a>
              </div>
            </div>
          </div>
        </div>
        <div class="clock" id="current-time">--:--</div>
      </div>
    </div>
  </header>

  <main class="main settings-main">
    <h2 class="settings-heading"><span class="heading-icon" aria-hidden="true"><i class="ph ph-user-circle"></i></span> Profile</h2>

    <section class="card settings-card">
      <div class="settings-section-title"><span class="section-title-icon" aria-hidden="true"><i class="ph ph-identification-card"></i></span> Basic Info</div>
      <div class="settings-field">
        <label for="caregiver_name">Name</label>
        <input type="text" id="caregiver_name" name="caregiver_name" maxlength="80" placeholder="Your name" />
      </div>
      <div class="settings-field">
        <label for="caregiver_email">Email</label>
        <input type="email" id="caregiver_email" name="caregiver_email" maxlength="120" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="settings-field">
        <label for="caregiver_phone">Phone</label>
        <input type="tel" id="caregiver_phone" name="caregiver_phone" maxlength="40" placeholder="Optional" autocomplete="tel" />
      </div>
      <div class="settings-field">
        <label for="caregiver_relationship">Relationship</label>
        <input type="text" id="caregiver_relationship" name="caregiver_relationship" maxlength="80" placeholder="Parent, nurse, grandparent" />
      </div>
      <div class="settings-field">
        <label for="caregiver_notes">Notes</label>
        <textarea id="caregiver_notes" name="caregiver_notes" rows="4" maxlength="1000" placeholder="Useful handoff context"></textarea>
      </div>
    </section>

    <div class="settings-save-row">
      <button class="settings-save-btn" id="caregiver-profile-save"><i class="ph ph-floppy-disk" aria-hidden="true"></i> Save Profile</button>
      <div class="settings-status" id="caregiver-profile-status" aria-live="polite"></div>
    </div>
  </main>

  <footer class="footer"><span>Glide Bedside</span></footer>

  <script src="auth-fetch.js"></script>
  <script src="version-watch.js"></script>
  <script src="nav.js"></script>
  <script src="settings.js"></script>
</body>
</html>
