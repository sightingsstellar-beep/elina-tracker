<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#2f7f9f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <title>Glide Bedside — Caregivers</title>
  <link rel="stylesheet" href="/vendor/phosphor/regular/style.css" />
  <link rel="stylesheet" href="/vendor/phosphor/fill/style.css" />
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="settings.css" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div class="header-left">
        <h1 class="title"><span id="child-name">…</span> <span class="heart" aria-hidden="true"><i class="ph-fill ph-heart"></i></span></h1>
        <div class="subtitle" id="current-date">Loading...</div>
      </div>
      <div class="header-right">
        <div class="top-menu" data-top-menu>
          <button class="top-menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" data-top-menu-toggle>
            <span class="top-menu-toggle-line"></span>
            <span class="top-menu-toggle-line"></span>
            <span class="top-menu-toggle-line"></span>
          </button>
          <div class="top-nav" data-top-menu-panel>
            <div class="top-nav-group">
              <button class="top-nav-trigger" type="button">Chart <i class="ph ph-caret-down" aria-hidden="true"></i></button>
              <div class="top-nav-dropdown">
                <a href="/">Day</a>
                <a href="/history">Trends</a>
                <a href="/chat">Chat</a>
              </div>
            </div>
            <a href="/caregiver-profile" class="top-nav-item">Caregiver Profile</a>
            <a href="/patient-profile" class="top-nav-item">Patient Profile</a>
            <a href="/caregivers" class="top-nav-item active" aria-current="page">Caregivers</a>
            <a href="/settings" class="top-nav-item">App Settings</a>
            <div class="account-menu">
              <button class="top-nav-trigger" type="button" aria-expanded="false" data-account-menu-button><span data-caregiver-name>Caregiver</span> <i class="ph ph-caret-down" aria-hidden="true"></i></button>
              <div class="account-menu-panel" hidden data-account-menu-panel>
                <a href="/logout"><i class="ph ph-power" aria-hidden="true"></i> Log out</a>
              </div>
            </div>
          </div>
        </div>
        <div class="clock" id="current-time">--:--</div>
      </div>
    </div>
    <nav class="tab-bar" aria-label="Chart">
      <a href="/" class="tab-item">
        <span class="tab-icon" aria-hidden="true"><i class="tab-icon-outline ph ph-drop"></i><i class="tab-icon-fill ph-fill ph-drop"></i></span>
        <span class="tab-label">Day</span>
      </a>
      <a href="/history" class="tab-item">
        <span class="tab-icon" aria-hidden="true"><i class="tab-icon-outline ph ph-chart-line-up"></i><i class="tab-icon-fill ph-fill ph-chart-line-up"></i></span>
        <span class="tab-label">Trends</span>
      </a>
      <a href="/chat" class="tab-item">
        <span class="tab-icon" aria-hidden="true"><i class="tab-icon-outline ph ph-microphone"></i><i class="tab-icon-fill ph-fill ph-microphone"></i></span>
        <span class="tab-label">Chat</span>
      </a>
    </nav>
  </header>

  <main class="main settings-main">
    <h2 class="settings-heading"><span class="heading-icon" aria-hidden="true"><i class="ph ph-users"></i></span> Caregivers</h2>

    <section class="card settings-card" id="caregiver-card">
      <div class="settings-section-title"><span class="section-title-icon" aria-hidden="true"><i class="ph ph-user-plus"></i></span> Invite Access</div>
      <p class="settings-help">Invite another caregiver to access this same family/patient tracker with their own login.</p>
      <div class="family-members" id="family-members" aria-live="polite">
        <div class="family-members-loading">Loading family access…</div>
      </div>
      <div class="settings-field">
        <label for="invite_email">Caregiver email</label>
        <input type="email" id="invite_email" name="invite_email" placeholder="caregiver@example.com" autocomplete="email" />
      </div>
      <div class="settings-field">
        <label for="invite_role">Role</label>
        <select id="invite_role" name="invite_role">
          <option value="caregiver">Caregiver</option>
          <option value="viewer">Viewer</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button class="settings-save-btn" id="invite-btn" type="button">Send Invite</button>
      <div class="settings-status" id="invite-status" aria-live="polite"></div>
    </section>
  </main>

  <footer class="footer"><span>Glide Bedside</span></footer>

  <script src="auth-fetch.js"></script>
  <script src="version-watch.js"></script>
  <script src="nav.js"></script>
  <script src="settings.js"></script>
</body>
</html>
