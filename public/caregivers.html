<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2f7f9f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <title>Glide Bedside — Caregivers</title>
  <link rel="stylesheet" href="/vendor/phosphor/regular/style.css" />
  <link rel="stylesheet" href="/vendor/phosphor/fill/style.css" />
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="settings.css" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
</head>
<body class="no-chart-tabs">
  <header class="header">
    <div class="header-top">
      <div class="header-left">
        <h1 class="title"><span id="child-name">…</span> <span class="heart" aria-hidden="true"><i class="ph-fill ph-heart"></i></span></h1>
        <div class="subtitle" id="current-date">Loading...</div>
      </div>
      <div class="header-right">
        <div class="top-menu" data-top-menu>
          <button class="top-menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" data-top-menu-toggle>
            <span class="top-menu-toggle-line"></span>
            <span class="top-menu-toggle-line"></span>
            <span class="top-menu-toggle-line"></span>
          </button>
          <div class="top-nav" data-top-menu-panel>
            <a href="/" class="top-nav-item"><i class="ph ph-chart-line-up" aria-hidden="true"></i> <span>Chart</span></a>
            <a href="/patient-profile" class="top-nav-item"><i class="ph ph-heart" aria-hidden="true"></i> <span>Patient Profile</span></a>
            <a href="/settings" class="top-nav-item"><i class="ph ph-gear-six" aria-hidden="true"></i> <span>App Settings</span></a>
            <div class="account-menu">
              <button class="top-nav-trigger active" type="button" aria-expanded="false" data-account-menu-button><i class="ph ph-user-circle" aria-hidden="true"></i> <span data-caregiver-name>Caregiver</span> <i class="ph ph-caret-down" aria-hidden="true"></i></button>
              <div class="account-menu-panel" hidden data-account-menu-panel>
                <a href="/caregiver-profile"><i class="ph ph-user-circle" aria-hidden="true"></i> Profile</a>
                <a href="/caregivers" class="active" aria-current="page"><i class="ph ph-users" aria-hidden="true"></i> Caregivers</a>
                <a href="/logout"><i class="ph ph-power" aria-hidden="true"></i> Log out</a>
              </div>
            </div>
          </div>
        </div>
        <div class="clock" id="current-time">--:--</div>
      </div>
    </div>
  </header>

  <main class="main settings-main">
    <h2 class="settings-heading"><span class="heading-icon" aria-hidden="true"><i class="ph ph-users"></i></span> Caregivers</h2>

    <section class="card settings-card" id="caregiver-card">
      <div class="settings-section-title"><span class="section-title-icon" aria-hidden="true"><i class="ph ph-user-plus"></i></span> Invite Access</div>
      <p class="settings-help">Invite another caregiver to access this same family/patient tracker with their own login.</p>
      <div class="family-members" id="family-members" aria-live="polite">
        <div class="family-members-loading">Loading family access…</div>
      </div>
      <div class="settings-permission-note" id="invite-permission-note" hidden>Only the family owner can invite caregivers.</div>
      <div class="invite-access-form" id="invite-access-form">
        <div class="settings-field">
          <label for="invite_email">Caregiver email</label>
          <input type="email" id="invite_email" name="invite_email" placeholder="caregiver@example.com" autocomplete="email" />
        </div>
        <div class="settings-field">
          <label for="invite_role">Role</label>
          <select id="invite_role" name="invite_role">
            <option value="caregiver">Caregiver</option>
            <option value="viewer">Viewer</option>
          </select>
        </div>
        <button class="settings-save-btn" id="invite-btn" type="button">Send Invite</button>
      </div>
      <div class="settings-status" id="invite-status" aria-live="polite"></div>
    </section>
  </main>

  <footer class="footer"><span>Glide Bedside</span></footer>

  <script src="auth-fetch.js"></script>
  <script src="viewport-guard.js"></script>
  <script src="version-watch.js"></script>
  <script src="nav.js"></script>
  <script src="settings.js"></script>
</body>
</html>
